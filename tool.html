<script>

"use strict";


const FALLBACK_IMAGE =
"https://i.ibb.co/842QM2Ms/da3c60c60705ea25ae03d07cd940ff2d.jpg";


const params =
new URLSearchParams(
window.location.search
);


const toolId =
params.get("id");


const content =
document.getElementById(
"toolContent"
);


document.getElementById(
"year"
).textContent =
new Date().getFullYear();


function escapeHtml(value) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/*
 * جميع ملفات الأدوات
 */

const toolFiles = [

    "tools/tools.json",

    "tools/tools2.json",

    "tools/tools3.json",

    "tools/tools4.json",

    "tools/tools5.json",

    "tools/tools6.json",

    "tools/tools7.json",

    "tools/tools8.json",

    "tools/tools9.json",

    "tools/tools10.json"

];


async function loadTool() {

    try {

        let tool = null;


        for (
            const file of toolFiles
        ) {

            try {

                const response =
                    await fetch(
                        file,
                        {
                            cache:
                            "no-cache"
                        }
                    );


                if (
                    !response.ok
                ) {

                    console.warn(
                        `تعذر تحميل الملف: ${file}`
                    );

                    continue;

                }


                const tools =
                    await response.json();


                if (
                    !Array.isArray(
                        tools
                    )
                ) {

                    console.warn(
                        `الملف ليس JSON Array صالح: ${file}`
                    );

                    continue;

                }


                const found =
                    tools.find(
                        item =>
                            String(
                                item.id ||
                                ""
                            ).trim() ===
                            String(
                                toolId ||
                                ""
                            ).trim()
                    );


                if (
                    found
                ) {

                    tool =
                        found;

                    break;

                }

            }

            catch(error) {

                console.warn(
                    `خطأ في تحميل ${file}:`,
                    error
                );

            }

        }


        if (
            !tool
        ) {

            showNotFound();

            return;

        }


        renderTool(
            tool
        );

    }

    catch(error) {

        console.error(
            error
        );

        showNotFound();

    }

}


function renderTool(
    tool
) {

    const image =
        Array.isArray(
            tool.img
        ) &&
        tool.img.length &&
        tool.img[0]

        ? tool.img[0]

        : (
            typeof tool.img ===
            "string" &&
            tool.img.trim()

            ? tool.img.trim()

            : FALLBACK_IMAGE
        );


    document.title =
        `${tool.name} | شرح واستخدام أداة Kali Linux`;


    setMeta(
        "description",
        `${tool.name}: ${
            tool.importance ||
            tool.description ||
            "شرح أداة من أدوات Kali Linux واستخداماتها وتثبيتها وأوامرها."
        }`
    );


    setCanonical();


    const useCases =
        Array.isArray(
            tool.use_cases
        )
        ? tool.use_cases
        : [];


    const examples =
        Array.isArray(
            tool.examples
        )
        ? tool.examples
        : [];


    const requirements =
        Array.isArray(
            tool.requirements
        )
        ? tool.requirements
        : [];


    const categories =
        Array.isArray(
            tool.categories
        )
        ? tool.categories
        : [
            tool.category ||
            "Kali Linux"
        ];


    content.innerHTML = `

        <article>

            <header class="tool-header">

                <img
                    class="tool-main-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(tool.name)} - Kali Linux"
                    onerror="this.src='${FALLBACK_IMAGE}'"
                >

                <div>

                    <div class="tool-category">

                        ${escapeHtml(
                            categories.join(" · ")
                        )}

                    </div>

                    <h1 class="tool-title">

                        ${escapeHtml(
                            tool.name
                        )}

                    </h1>

                    <p class="tool-importance">

                        ${escapeHtml(
                            tool.importance ||
                            tool.description
                        )}

                    </p>

                </div>

            </header>


            <section class="tool-box">

                <h2>

                    ما هي
                    ${escapeHtml(
                        tool.name
                    )}؟

                </h2>

                <p>

                    ${escapeHtml(
                        tool.description ||
                        tool.importance ||
                        "أداة من أدوات Kali Linux."
                    )}

                </p>

            </section>


            ${
                useCases.length
                ? `

                <section class="tool-box">

                    <h2>
                        أهم الاستخدامات
                    </h2>

                    <div class="info-list">

                        ${useCases.map(
                            item =>
                            `<div class="info-item">
                                ${escapeHtml(item)}
                            </div>`
                        ).join("")}

                    </div>

                </section>

                `
                : ""
            }


            ${
                tool.installation
                ? `

                <section class="tool-box">

                    <h2>
                        التثبيت
                    </h2>

                    <div class="code-box">

                        ${escapeHtml(
                            tool.installation
                        )}

                    </div>

                </section>

                `
                : ""
            }


            ${
                tool.basic_usage
                ? `

                <section class="tool-box">

                    <h2>
                        الاستخدام الأساسي
                    </h2>

                    <div class="code-box">

                        ${escapeHtml(
                            tool.basic_usage
                        )}

                    </div>

                </section>

                `
                : ""
            }


            ${
                examples.length
                ? `

                <section class="tool-box">

                    <h2>
                        أمثلة
                    </h2>

                    ${examples.map(
                        item =>
                        `<div class="code-box">
                            ${escapeHtml(item)}
                        </div>`
                    ).join("")}

                </section>

                `
                : ""
            }


            ${
                requirements.length
                ? `

                <section class="tool-box">

                    <h2>
                        المتطلبات
                    </h2>

                    <div class="info-list">

                        ${requirements.map(
                            item =>
                            `<div class="info-item">
                                ${escapeHtml(item)}
                            </div>`
                        ).join("")}

                    </div>

                </section>

                `
                : ""
            }


            ${
                tool.official_website
                ? `

                <section class="tool-box">

                    <h2>
                        الموقع الرسمي
                    </h2>

                    <a
                        class="tool-link"
                        href="${escapeHtml(
                            tool.official_website
                        )}"
                        target="_blank"
                        rel="noopener noreferrer">

                        ${escapeHtml(
                            tool.official_website
                        )}

                    </a>

                </section>

                `
                : ""
            }


            ${
                tool.kali_page
                ? `

                <section class="tool-box">

                    <h2>
                        صفحة الأداة في Kali
                    </h2>

                    <a
                        class="tool-link"
                        href="${escapeHtml(
                            tool.kali_page
                        )}"
                        target="_blank"
                        rel="noopener noreferrer">

                        ${escapeHtml(
                            tool.kali_page
                        )}

                    </a>

                </section>

                `
                : ""
            }


            ${
                tool.legal_note
                ? `

                <section class="tool-box">

                    <h2>
                        الاستخدام القانوني
                    </h2>

                    <p>

                        ${escapeHtml(
                            tool.legal_note
                        )}

                    </p>

                </section>

                `
                : ""
            }

        </article>

    `;


    addSchema(
        tool
    );

}


function setMeta(
    name,
    contentValue
) {

    let meta =
        document.querySelector(
            `meta[name="${name}"]`
        );


    if (
        !meta
    ) {

        meta =
            document.createElement(
                "meta"
            );


        meta.name =
            name;


        document.head.appendChild(
            meta
        );

    }


    meta.content =
        contentValue;

}


function setCanonical() {

    const url =
        window.location.href;


    let canonical =
        document.querySelector(
            'link[rel="canonical"]'
        );


    if (
        !canonical
    ) {

        canonical =
            document.createElement(
                "link"
            );


        canonical.rel =
            "canonical";


        document.head.appendChild(
            canonical
        );

    }


    canonical.href =
        url;

}


function addSchema(
    tool
) {

    const schema = {

        "@context":
            "https://schema.org",

        "@type":
            "TechArticle",

        "headline":
            `${tool.name} - شرح واستخدام أداة Kali Linux`,

        "description":
            tool.description ||
            tool.importance ||
            "",

        "inLanguage":
            "ar",

        "about":
            tool.name,

        "url":
            window.location.href

    };


    const script =
        document.createElement(
            "script"
        );


    script.type =
        "application/ld+json";


    script.textContent =
        JSON.stringify(
            schema
        );


    document.head.appendChild(
        script
    );

}


function showNotFound() {

    document.title =
        "الأداة غير موجودة | Kali Tools";


    content.innerHTML = `

        <div class="empty-state">

            <h1>
                الأداة غير موجودة
            </h1>

            <p>
                تأكد من رابط الأداة أو أضفها
                إلى أحد ملفات الأدوات.
            </p>

            <a
                href="./"
                class="back-btn">

                العودة للرئيسية

            </a>

        </div>

    `;

}


loadTool();

</script>
